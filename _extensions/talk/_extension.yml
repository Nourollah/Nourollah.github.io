title: Research Talk
author: Amir Masoud Nourollah
version: 1.0.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      # Default slide template for every deck: use `format: talk-revealjs`.
      # Navy = structure, teal = primary accent / "known", amber = "new" or failing.
      theme: [default, theme.scss]
      include-after-body: footer.html
      logo: logo.png
      width: 1280
      height: 720
      margin: 0
      center: false
      hash: true
      controls: true
      progress: false
      slide-number: false
      incremental: false
      transition: none
      background-transition: none
      title-slide-attributes:
        data-section: "Introduction"
